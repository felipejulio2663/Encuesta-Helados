<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuesta de Helados</title>
    <script src="https://tailwindcss.com"></script>
    <script src="https://jsdelivr.net"></script>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --font-heading: 'Caveat', cursive;
            --font-body: 'Nunito', sans-serif;
            --shadow-custom: 0px 8px 24px -4px rgba(251, 146, 60, 0.15);
            --shadow-custom-hover: 0px 12px 32px -4px rgba(251, 146, 60, 0.25);
        }
        .font-heading { font-family: var(--font-heading); }
        .font-body { font-family: var(--font-body); }
        .shadow-custom { box-shadow: var(--shadow-custom); }
        .hover-shadow-custom:hover { box-shadow: var(--shadow-custom-hover); }
    </style>
</head>
<body class="font-body bg-orange-50 text-neutral-800 antialiased">
    <div class="min-h-screen flex flex-col items-center justify-center py-12 px-4">
        <main class="w-full max-w-4xl flex flex-col gap-10">
            <header class="text-center px-4 flex flex-col items-center">
                <h1 class="font-heading text-5xl md:text-7xl text-orange-600 font-bold tracking-wide">
                    Para ti, ¿qué sabor de helado es mejor?
                </h1>
            </header>

            <form id="encuesta-form" class="w-full grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-white p-6 rounded-2xl shadow-custom flex flex-col gap-3">
                    <label for="nombre" class="font-semibold">¿Cuál es tu nombre?</label>
                    <input type="text" id="nombre" name="nombre" class="w-full px-4 py-3 bg-orange-50/50 border border-orange-100 rounded-lg" required>
                </div>

                <div class="bg-white p-6 rounded-2xl shadow-custom flex flex-col gap-3">
                    <label for="sabor" class="font-semibold">Selecciona tu sabor preferido</label>
                    <select id="sabor" name="sabor" class="w-full px-4 py-3 bg-orange-50/50 border border-orange-100 rounded-lg cursor-pointer" required>
                        <option value="" disabled selected>Elige un sabor...</option>
                        <option value="Vainilla">Vainilla</option>
                        <option value="Chocolate">Chocolate</option>
                        <option value="Fresa">Fresa</option>
                        <option value="Arequipe">Arequipe</option>
                        <option value="Mora">Mora</option>
                        <option value="Macadamia">Macadamia</option>
                    </select>
                </div>

                <div class="md:col-span-2">
                    <button type="submit" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-4 rounded-2xl transition-all shadow-custom">
                        Enviar Encuesta
                    </button>
                </div>
            </form>

            <div class="mt-10 p-6 bg-white rounded-xl shadow-lg w-full">
                <h2 class="text-2xl font-bold text-center text-purple-800 mb-4">Resultados en Tiempo Real</h2>
                <canvas id="graficoHelados"></canvas>
                <div class="mt-6 overflow-x-auto">
                    <table class="min-w-full border-collapse">
                        <thead class="bg-purple-100">
                            <tr>
                                <th class="py-2 px-4 border-b text-left">Sabor</th>
                                <th class="py-2 px-4 border-b text-center">Votos</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-body"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getFirestore, collection, addDoc, onSnapshot } from "https://gstatic.com";

        const firebaseConfig = {
            apiKey: "AlzaSyD0vSa0pVzOvLfXayK_xi-EjYFNepn1jEg",
            authDomain: "://firebaseapp.com",
            projectId: "encuesta-helados",
            storageBucket: "encuesta-helados.firebasestorage.app",
            messagingSenderId: "781087540945",
            appId: "1:781087540945:web:5da994caa7e6288d3867f0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const form = document.getElementById('encuesta-form');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const nombre = document.getElementById('nombre').value;
            const sabor = document.getElementById('sabor').value;

            try {
                await addDoc(collection(db, "respuestas_encuesta"), {
                    usuario: nombre,
                    sabor_preferido: sabor,
                    fecha: new Date()
                });
                form.reset();
            } catch (error) {
                console.error(error);
                alert("Error al registrar voto.");
            }
        });

        const ctx = document.getElementById('graficoHelados').getContext('2d');
        let miGrafico = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Vainilla', 'Chocolate', 'Fresa', 'Arequipe', 'Mora', 'Macadamia'],
                datasets: [{
                    label: 'Votos',
                    data: [0, 0, 0, 0, 0, 0],
                    backgroundColor: ['#F3E5AB', '#7B3F00', '#FFB7C5', '#F5DEB3', '#962343', '#EBD8B1']
                }]
            }
        });

        onSnapshot(collection(db, "respuestas_encuesta"), (snapshot) => {
            const conteo = { 'Vainilla': 0, 'Chocolate': 0, 'Fresa': 0, 'Arequipe': 0, 'Mora': 0, 'Macadamia': 0 };
            
            snapshot.docs.forEach(doc => {
                const data = doc.data();
                if (conteo[data.sabor_preferido] !== undefined) {
                    conteo[data.sabor_preferido]++;
                }
            });

            miGrafico.data.datasets[0].data = Object.values(conteo);
            miGrafico.update();

            document.getElementById('tabla-body').innerHTML = Object.entries(conteo)
                .map(([sabor, votos]) => `
                    <tr>
                        <td class="py-2 px-4 border-b">${sabor}</td>
                        <td class="py-2 px-4 border-b text-center font-bold">${votos}</td>
                    </tr>
                `).join('');
        });
    </script>
</body>
</html>
